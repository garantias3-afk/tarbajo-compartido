name: R13 Quality CI

on:
  push:
    branches: ['**']
    paths:
      - 'harness/**'
      - 'src/**'
      - 'config/**'
      - 'schemas/**'
      - 'r13/**'
      - 'tests/**'
      - 'tools/r13_quality/**'
      - 'VALIDATE_MODEL_REGISTRY_V3.py'
      - '.github/workflows/r13-quality-ci.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'src/**'
      - 'config/**'
      - 'schemas/**'
      - 'r13/**'
      - 'tests/**'
      - 'tools/r13_quality/**'
      - 'VALIDATE_MODEL_REGISTRY_V3.py'
      - '.github/workflows/r13-quality-ci.yml'
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Zero-collection guard (fail-closed)
        run: python tools/r13_quality/test_collection_guard.py tests/test_r13_mutation_runner.py tests/test_r13_script_quality.py tests/test_r13_ci_contract.py tests/test_model_registry_v3.py tests/test_binding_gates.py tests/test_fo10_parser_contract.py tests/test_gptoss_response_contract.py

      - name: Mutation engine meta-tests
        run: pytest tests/test_r13_mutation_runner.py -q

      - name: Real script quality tests
        run: pytest tests/test_r13_script_quality.py -q

      - name: CI contract tests
        run: pytest tests/test_r13_ci_contract.py -q

      - name: CI contract
        run: python tools/r13_quality/ci_contract.py

      - name: Targeted R13 tests
        run: pytest tests/test_model_registry_v3.py tests/test_binding_gates.py tests/test_fo10_parser_contract.py tests/test_gptoss_response_contract.py -q

      - name: Secret scan
        run: python tools/r13_quality/secret_scan.py

      - name: Mutation smoke
        run: |
          python tools/r13_quality/mutation_runner.py --specs tools/r13_quality/mutation_specs.v1.json --group smoke --timeout 30 --output "$RUNNER_TEMP/smoke_receipts"
          python tools/r13_quality/smoke_gate.py --summary "$RUNNER_TEMP/smoke_receipts/SUMMARY.json"
